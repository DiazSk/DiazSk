<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="band.css">
<style>
  .mark{font-size:100px;white-space:nowrap}
  .mark .em{font-size:1.08em;color:var(--hot)}
</style>
<body class="paper">
<div class="row label"><span>Contact &middot; end of reel</span><span class="dim">zaid-data.vercel.app</span></div>
<p class="mark caps" id="m">Zaid Shaikh <span class="em">Fin.</span></p>
<div class="row rule label"><span>Full-time from Dec 2026</span><span class="dim">Data &middot; AI &amp; product engineering</span><span>Seattle, WA</span></div>
<script>
  document.fonts.ready.then(() => {
    const el = document.getElementById("m"), target = document.body.clientWidth - 96;
    let lo = 10, hi = 400;
    for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; el.style.fontSize = mid + "px"; (el.scrollWidth <= target ? lo = mid : hi = mid); }
    el.style.fontSize = lo + "px";
    document.documentElement.dataset.ready = "1";
  });
</script>
